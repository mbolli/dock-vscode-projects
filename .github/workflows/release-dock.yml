name: Release dock (winget EXE installers)

# Cut a release by pushing a tag like `dock-v0.1.0.0`, or run manually with a version.
on:
  push:
    tags:
      - 'dock-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  PROJECT_DIR: dock/VsCodeProjectsDockExtension/VsCodeProjectsDockExtension

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}" -replace '^dock-v', '' }
          if (-not $v) { throw "No version" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Build installers (x64 + arm64)
        shell: pwsh
        working-directory: ${{ env.PROJECT_DIR }}
        run: .\build-exe.ps1 -Version "${{ steps.ver.outputs.version }}" -Platforms @('x64','arm64')

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dock-v${{ steps.ver.outputs.version }}
          name: VS Code Projects Dock v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: ${{ env.PROJECT_DIR }}/bin/Release/installer/*.exe
